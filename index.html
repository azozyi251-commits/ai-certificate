<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وثيقة هندسة سيبرانية | عبدالعزيز إبراهيم ناصر المبيريك</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            user-select: none;
            text-align: center;
        }

        /* طبقة حجب الرؤية في حال محاولة التصوير أو مغادرة الصفحة */
        #anti-capture-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            z-index: 99999;
            display: none;
            justify-content: center;
            align-items: center;
            color: #ff0000;
            font-family: 'Cairo', sans-serif;
            font-size: 28px;
            font-weight: 900;
            text-shadow: 0 0 20px #ff0000;
        }

        /* نافذة تسجيل الدخول - مربع أخضر فخم */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .auth-box {
            background: #030a03;
            border: 3px solid #00ff66;
            padding: 50px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 255, 102, 0.4);
            max-width: 450px;
            width: 90%;
        }
        .name-flag-header {
            font-family: 'Cairo', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: #00ff66;
            margin-bottom: 25px;
            text-shadow: 0 0 15px #00ff66;
            line-height: 1.5;
        }
        .auth-box input {
            background: #000;
            border: 2px solid #00ff66;
            color: #00ff66;
            padding: 15px;
            width: 100%;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            font-family: 'Share Tech Mono', monospace;
        }
        .auth-box button {
            background: transparent;
            color: #00ff66;
            border: 2px solid #00ff66;
            padding: 12px 30px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }
        .auth-box button:hover {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 25px #00ff66;
        }
        #error-msg {
            color: #ff0055;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            font-family: 'Cairo', sans-serif;
        }

        /* محتوى الشهادة - مربع أخضر */
        #cert-content {
            display: none;
            width: 100%;
            justify-content: center;
            align-items: center;
        }
        .cert-frame {
            background: #030a03;
            border: 4px solid #00ff66;
            box-shadow: 0 0 60px rgba(0, 255, 102, 0.5);
            max-width: 800px;
            width: 100%;
            padding: 60px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        .cert-text {
            font-family: 'Cairo', sans-serif;
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            line-height: 2.2;
            text-shadow: 0 0 15px #00ff66;
        }
        .holder-name-cert {
            color: #00ff66;
            font-weight: 900;
            font-size: 36px;
            text-shadow: 0 0 25px #00ff66;
            border-bottom: 2px solid #00ff66;
            padding-bottom: 5px;
            display: inline-block;
            margin-top: 10px;
        }
        .footer-signature {
            margin-top: 30px;
            width: 100%;
            border-top: 1px solid rgba(0, 255, 102, 0.3);
            padding-top: 20px;
            display: flex;
            justify-content: flex-end;
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            color: #00ff66;
            font-weight: bold;
            text-shadow: 0 0 10px #00ff66;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- شاشة الطوارئ لحجب التصوير -->
    <div id="anti-capture-overlay">
        [!] تَمَّ رَصْدُ مُحَاوَلَةِ تَصْوِيرٍ.. حُظِرَتِ الشَّاشَةُ [!]
    </div>

    <!-- واجهة تسجيل الدخول (اسمك + علم السعودية + كلمة السر) -->
    <div id="auth-overlay">
        <div class="auth-box">
            <div class="name-flag-header">
                عبدالعزيز إبراهيم ناصر المبيريك<br>
                  SA
            </div>
            <input type="password" id="pass-input" placeholder="أدخل كلمة السر" autocomplete="off">
            <button onclick="checkPassword()">دخول</button>
            <div id="error-msg">كلمة السر غير صحيحة!</div>
        </div>
    </div>

    <!-- محتوى الشهادة (مربع أخضر بالكلام المطلوب والتوقيع فقط) -->
    <div id="cert-content">
        <div class="cert-frame">
            <div class="cert-text">
                وثيقة هندسة سيبرانية تمنح الى<br>
                <span class="holder-name-cert">عبد العزيز ابراهيم ناصر المبيريك</span>
            </div>
            <div class="footer-signature">
                التوقيع: AI
            </div>
        </div>
    </div>

    <script>
        const MASTER_PASSWORD = "King_Secret_2026"; 

        function checkPassword() {
            const userInput = document.getElementById('pass-input').value;
            const errorMsg = document.getElementById('error-msg');
            
            if (userInput === MASTER_PASSWORD) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('cert-content').style.display = 'flex';
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('pass-input').value = '';
            }
        }

        document.getElementById('pass-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // --- درع منع التصوير المتقدم (كمبيوتر وجوال) ---
        const blocker = document.getElementById('anti-capture-overlay');

        // 1. منع أزرار التصوير وفحص العناصر
        document.addEventListener('keydown', function(event) {
            if (event.key === 'F12' || 
                (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'J' || event.key === 'C')) || 
                (event.ctrlKey && event.key === 'U') || 
                event.key === 'PrintScreen' ||
                (event.metaKey && event.shiftKey && event.key === '3')) { // لقطة شاشة للماك
                event.preventDefault();
                triggerBlocker();
            }
        });

        // 2. تفعيل الشاشة السوداء إذا حاول المستخدم الخروج من نافذة الموقع أو أخذ لقطة
        window.addEventListener('blur', function() {
            blocker.style.display = 'flex';
        });

        window.addEventListener('focus', function() {
            blocker.style.display = 'none';
        });

        function triggerBlocker() {
            blocker.style.display = 'flex';
            setTimeout(() => {
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:40vh; font-family:Cairo;'>[!] تم رصد محاولة انتهاك أمني.. انتهى الأمر [!]</h1>";
            }, 1000);
        }
    </script>

</body>
</html>
