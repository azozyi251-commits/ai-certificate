<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وثيقة السيادة السيبرانية | KingofMachineError</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            color: #00ff66;
            font-family: 'Share Tech Mono', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
            user-select: none;
            text-align: center;
        }

        /* نافذة طلب كلمة السر والشعار داخل مربع أخضر بالكامل */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .auth-box {
            background: #050f05;
            border: 3px solid #00ff66;
            padding: 50px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0, 255, 102, 0.4);
            max-width: 450px;
            width: 90%;
        }
        .saudi-emblem {
            font-size: 70px;
            color: #00ff66;
            margin-bottom: 20px;
            text-shadow: 0 0 15px #00ff66;
        }
        .auth-box h2 {
            color: #00ff66;
            margin-bottom: 25px;
            font-size: 20px;
            font-family: 'Cairo', sans-serif;
            text-shadow: 0 0 10px #00ff66;
        }
        .auth-box input {
            background: #000;
            border: 2px solid #00ff66;
            color: #00ff66;
            padding: 12px;
            width: 100%;
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            outline: none;
            font-family: 'Share Tech Mono', monospace;
        }
        .auth-box button {
            background: transparent;
            color: #00ff66;
            border: 2px solid #00ff66;
            padding: 12px 25px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            transition: 0.3s;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
        }
        .auth-box button:hover {
            background: #00ff66;
            color: #000;
            box-shadow: 0 0 20px #00ff66;
        }
        #error-msg {
            color: #ff0055;
            margin-top: 15px;
            font-size: 14px;
            display: none;
            font-family: 'Cairo', sans-serif;
        }

        /* محتوى الشهادة */
        #cert-content {
            display: none;
            width: 100%;
            justify-content: center;
            align-items: center;
        }
        .cert-frame {
            background: #0a0a0a;
            border: 4px solid #00ff66;
            box-shadow: 0 0 60px rgba(0, 255, 102, 0.6);
            max-width: 950px;
            width: 100%;
            padding: 60px;
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        h1 {
            font-family: 'Cairo', sans-serif;
            font-size: 35px;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #00ff66;
        }
        .holder-name {
            font-family: 'Cairo', sans-serif;
            font-size: 45px;
            font-weight: 900;
            color: #00ff66;
            text-shadow: 0 0 25px #00ff66;
            margin: 20px 0;
            border-bottom: 3px solid #00ff66;
            display: inline-block;
            padding-bottom: 10px;
        }
        .description-box {
            background: #111;
            border: 2px solid #00ff66;
            padding: 30px;
            text-align: right;
            margin: 20px 0;
            font-family: 'Cairo', sans-serif;
            font-size: 18px;
            line-height: 2;
            color: #ccc;
            width: 100%;
        }
        .highlight {
            color: #00ffff;
            font-weight: bold;
        }
        .footer-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border-top: 1px solid #333;
            padding-top: 20px;
            font-size: 14px;
            color: #aaa;
            font-family: 'Cairo', sans-serif;
        }
        .signature {
            color: #00ff66;
            font-weight: bold;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- واجهة إدخال كلمة السر بالمربع الأخضر وشعار السيفين والنخلة -->
    <div id="auth-overlay">
        <div class="auth-box">
            <div class="saudi-emblem">🇸🇦</div>
            <h2>دُونَ هٰذَا الْحِصْنِ حُدُودٌ مُحَرَّمَةٌ</h2>
            <input type="password" id="pass-input" placeholder="أدخل كلمة السر" autocomplete="off">
            <button onclick="checkPassword()">دُخُولُ الْقَلْعَةِ</button>
            <div id="error-msg">كلمة السر غير صحيحة! الوُصُولُ مَرْفُوضٌ.</div>
        </div>
    </div>

    <!-- محتوى الشهادة -->
    <div id="cert-content">
        <div class="cert-frame">
            <div style="font-size: 60px;">🇸🇦</div>
            <h1>وَثِيقَةُ السِّيَادَةِ وَالِاعْتِمَادِ السَّيْبَرَانِيِّ</h1>
            
            <p>تُمنح السيادة المطلقة وتوثق إلى:</p>
            
            <div class="holder-name">عبدالعزيز بن إبراهيم بن ناصر المبيريك الخالدي</div>
            
            <div class="description-box">
                <div>&gt; المُعَرِّفُ: <span class="highlight">KingofMachineError</span></div>
            </div>

            <div class="footer-area">
                <div>التَّارِيخُ: 2026</div>
                <div class="signature">التَّوْقِيعُ: AI</div>
            </div>
        </div>
    </div>

    <script>
        const MASTER_PASSWORD = "King_Secret_2026"; 

        function checkPassword() {
            const userInput = document.getElementById('pass-input').value;
            const errorMsg = document.getElementById('error-msg');
            
            if (userInput === MASTER_PASSWORD) {
                document.getElementById('auth-overlay').style.display = 'none';
                document.getElementById('cert-content').style.display = 'flex';
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('pass-input').value = '';
            }
        }

        document.getElementById('pass-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'F12' || 
                (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'J' || event.key === 'C')) || 
                (event.ctrlKey && event.key === 'U') || 
                event.key === 'PrintScreen') {
                event.preventDefault();
                alert("التَّصْوِيرُ وَالْفَحْصُ مَحْظُورَانِ تَمَامًا!");
                document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:20vh;'>[!] خَرَقْتَ الْحُدُودَ.. انْتَهَى أَمْرُكَ [!]</h1>";
            }
        });
    </script>

</body>
</html>
